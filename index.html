<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sistema de Inventario</title>
    <link rel="stylesheet" href="styles.css?v=1.1">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <h1>🔐 Sistema de Inventario</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                <div id="errorMessage" class="error-message"></div>
            </form>
            <div class="login-info">
                <p><strong>Usuario por defecto:</strong> vendedor1</p>
                <p><strong>Contraseña:</strong> vendedor1</p>
            </div>
        </div>
    </div>
    <!-- Supabase CDN y API Web para funcionamiento directo en el navegador/sitio web -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="webAPI.js"></script>
    <script src="login.js"></script>
</body>

</html>
