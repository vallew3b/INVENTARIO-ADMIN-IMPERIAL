<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sistema de Inventario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.6">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="login-brand">
                <div class="brand-badge">IMPERIAL</div>
                <h2 class="brand-title">URBAN STORE</h2>
                <p class="brand-subtitle">SISTEMA DE INVENTARIO</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <div class="input-container-modern">
                        <span class="input-icon-modern">👤</span>
                        <input type="text" id="usuario" required placeholder="Tu nombre de usuario" autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-container-modern">
                        <span class="input-icon-modern">🔒</span>
                        <input type="password" id="password" required placeholder="Tu contraseña de acceso" autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-login-modern">
                    Iniciar Sesión
                </button>
                <div id="errorMessage" class="error-message"></div>
            </form>
        </div>
    </div>
    <!-- Supabase CDN y API Web para funcionamiento directo en el navegador/sitio web -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="webAPI.js?v=1.6"></script>
    <script src="login.js?v=1.6"></script>
</body>

</html>
